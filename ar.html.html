<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨小科AR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            font-family: Arial;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">📱 请将摄像头对准识别图</div>

    <!-- 引入Three.js核心库和扩展 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- 1. 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // 天空蓝背景，稍后会替换为摄像头画面

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. 添加光照 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(-5, 0, 5);
        scene.add(fillLight);

        // --- 3. 加载墨小科模型 ---
        // 注意：GLTFLoader 加载的文件需要支持跨域（CORS）
        const loader = new GLTFLoader();
        // ⚠️ 这里需要把模型文件上传到网上，替换为你的在线模型地址
        const modelUrl = 'https://your-online-url.com/墨小科.glb';
        
        loader.load(
            modelUrl,
            (gltf) => {
                const model = gltf.scene;
                model.scale.set(0.5, 0.5, 0.5);
                model.position.set(0, -0.5, 0);
                scene.add(model);
                console.log('✅ 墨小科加载成功！');
            },
            (xhr) => {
                console.log(`模型加载中: ${Math.round((xhr.loaded / xhr.total) * 100)}%`);
            },
            (error) => {
                console.error('❌ 模型加载失败:', error);
                // 显示一个替代的3D物体，方便演示
                const geometry = new THREE.SphereGeometry(0.5, 32, 32);
                const material = new THREE.MeshStandardMaterial({ color: 0x00aaff });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(0, 0, 0);
                scene.add(sphere);
                document.getElementById('info').textContent = '⚠️ 模型加载失败，显示替代球体';
            }
        );

        // --- 4. 添加一个地面网格（便于观察3D空间） ---
        const gridHelper = new THREE.GridHelper(3, 10, 0x88ccff, 0x446688);
        gridHelper.position.y = -0.8;
        scene.add(gridHelper);

        // --- 5. 添加一个小平台 ---
        const platformGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.1, 32);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, transparent: true, opacity: 0.3 });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.set(0, -0.75, 0);
        platform.receiveShadow = true;
        scene.add(platform);

        // --- 6. 控制器（方便在浏览器中拖拽查看） ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2;

        // --- 7. 窗口自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 8. 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        console.log('🚀 墨小科AR网页已启动！');
    </script>
</body>
</html>
