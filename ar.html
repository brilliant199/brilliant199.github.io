<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨小科AR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        #info {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            font-family: Arial;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            font-family: Arial;
            z-index: 200;
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">⏳ 加载模型中...</div>
    <div id="info">📱 墨小科 AR 体验</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // --- 1. 场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // --- 2. 相机 ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.5, 2.5);

        // --- 3. 渲染器 ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 4. 灯光 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.5);
        mainLight.position.set(3, 5, 4);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
        fillLight.position.set(-3, 1, -2);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xff8844, 0.3);
        backLight.position.set(-1, 0.5, -3);
        scene.add(backLight);

        // --- 5. 地面网格 ---
        const gridHelper = new THREE.GridHelper(3, 12, 0x4488ff, 0x224477);
        gridHelper.position.y = -0.4;
        scene.add(gridHelper);

        // --- 6. 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.3, 0);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2;
        controls.minDistance = 1;
        controls.maxDistance = 6;
        controls.update();

        // --- 7. 加载模型（支持 Draco 压缩） ---
        const loadingDiv = document.getElementById('loading');
        
        // 配置 Draco 解码器
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        // ⚠️ 重要：把下面这个链接改成你压缩后的模型文件名
        const modelUrl = 'https://brilliant199.github.io/robot_compressed.glb';
        console.log('开始加载模型:', modelUrl);

        loader.load(
            modelUrl,
            (gltf) => {
                const model = gltf.scene;
                
                // 调整模型大小和位置
                model.scale.set(0.5, 0.5, 0.5);
                model.position.set(0, -0.2, 0);
                model.rotation.y = 0.3;
                
                scene.add(model);
                
                loadingDiv.textContent = '✅ 墨小科加载成功！';
                loadingDiv.style.backgroundColor = 'rgba(0,180,0,0.8)';
                setTimeout(() => {
                    loadingDiv.style.opacity = '0';
                    setTimeout(() => {
                        loadingDiv.style.display = 'none';
                    }, 500);
                }, 1500);
                
                console.log('✅ 模型加载成功！');
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingDiv.textContent = `⏳ 加载中... ${percent}%`;
                } else {
                    loadingDiv.textContent = '⏳ 加载中...';
                }
            },
            (error) => {
                console.error('❌ 模型加载失败:', error);
                loadingDiv.textContent = '⚠️ 模型加载失败，显示替代模型';
                loadingDiv.style.backgroundColor = 'rgba(200,50,0,0.8)';
                
                // --- 显示替代模型（代码生成的墨小科风格角色） ---
                createFallbackCharacter(scene);
            }
        );

        // --- 8. 替代模型函数（当加载失败时显示） ---
        function createFallbackCharacter(scene) {
            const character = new THREE.Group();

            // 身体
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, roughness: 0.3, metalness: 0.1 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), bodyMat);
            body.position.y = 0.3;
            body.castShadow = true;
            character.add(body);

            // 头部
            const headMat = new THREE.MeshStandardMaterial({ color: 0x66aaff, roughness: 0.2 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 32, 32), headMat);
            head.position.y = 0.8;
            head.castShadow = true;
            character.add(head);

            // 眼睛
            const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const pupilMat = new THREE.MeshStandardMaterial({ color: 0x222244 });
            [[-0.12, 0.85, 0.25], [0.12, 0.85, 0.25]].forEach(pos => {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), eyeWhiteMat);
                eye.position.set(pos[0], pos[1], pos[2]);
                character.add(eye);
                const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), pupilMat);
                pupil.position.set(pos[0] + (pos[0] > 0 ? 0.03 : -0.03), pos[1] - 0.01, pos[2] + 0.06);
                character.add(pupil);
            });

            // 嘴巴
            const mouthMat = new THREE.MeshStandardMaterial({ color: 0xff6688 });
            const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.02, 8, 16, Math.PI), mouthMat);
            mouth.position.set(0, 0.73, 0.28);
            mouth.rotation.x = 0.2;
            character.add(mouth);

            // 手臂
            const armMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, roughness: 0.4 });
            [[-0.35, 0.45, 0], [0.35, 0.45, 0]].forEach(pos => {
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.35, 8), armMat);
                arm.position.set(pos[0], pos[1], pos[2]);
                arm.rotation.z = pos[0] > 0 ? -0.3 : 0.3;
                arm.castShadow = true;
                character.add(arm);
            });

            // 天线
            const antennaMat = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0xff4400, emissiveIntensity: 0.5 });
            const antennaBase = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.015, 0.2, 6), antennaMat);
            antennaBase.position.set(0, 1.05, 0);
            character.add(antennaBase);
            const antennaTop = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), antennaMat);
            antennaTop.position.set(0, 1.18, 0);
            character.add(antennaTop);

            character.scale.set(0.7, 0.7, 0.7);
            character.position.set(0, 0, 0);
            scene.add(character);

            // 光环
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0x4488ff,
                emissive: 0x4488ff,
                emissiveIntensity: 0.3,
                transparent: true,
                opacity: 0.4,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.02, 16, 32), ringMat);
            ring.position.set(0, 0.5, 0);
            ring.rotation.x = Math.PI / 3;
            scene.add(ring);

            const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.015, 16, 32), ringMat);
            ring2.position.set(0, 0.5, 0);
            ring2.rotation.x = -Math.PI / 4;
            ring2.rotation.z = 0.5;
            scene.add(ring2);

            // 存到全局以便动画更新
            window._rings = [ring, ring2];
        }

        // --- 9. 窗口自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 10. 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            
            // 如果存在光环，让它们旋转
            if (window._rings) {
                window._rings.forEach(r => {
                    r.rotation.y += 0.01;
                });
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        console.log('🚀 墨小科AR已启动！');
    </script>
</body>
</html>
