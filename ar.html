<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨小科AR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        #info {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            font-family: Arial;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            font-family: Arial;
            z-index: 200;
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="loading">🚀 加载中...</div>
    <div id="info">📱 墨小科 AR 体验</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.5, 2.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.5);
        mainLight.position.set(3, 5, 4);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
        fillLight.position.set(-3, 1, -2);
        scene.add(fillLight);

        // --- 地面网格 ---
        const gridHelper = new THREE.GridHelper(3, 12, 0x4488ff, 0x224477);
        gridHelper.position.y = -0.4;
        scene.add(gridHelper);

        // --- 🎨 用代码拼一个“墨小科”风格角色 ---
        const character = new THREE.Group();

        // 1. 身体（蓝色圆角方块）
        const bodyGeo = new THREE.BoxGeometry(0.5, 0.6, 0.3);
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x4488ff, 
            roughness: 0.3,
            metalness: 0.1,
            emissive: 0x112244,
            emissiveIntensity: 0.2
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.3;
        body.castShadow = true;
        character.add(body);

        // 2. 头部（大圆球）
        const headGeo = new THREE.SphereGeometry(0.28, 32, 32);
        const headMat = new THREE.MeshStandardMaterial({ 
            color: 0x66aaff, 
            roughness: 0.2,
            metalness: 0.1
        });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 0.8;
        head.castShadow = true;
        character.add(head);

        // 3. 眼睛（两个小白球 + 黑色瞳孔）
        const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
        const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.0 });

        const eyePositions = [[-0.12, 0.85, 0.25], [0.12, 0.85, 0.25]];
        eyePositions.forEach(pos => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), eyeWhiteMat);
            eye.position.set(pos[0], pos[1], pos[2]);
            character.add(eye);
            
            const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), pupilMat);
            pupil.position.set(pos[0] + (pos[0] > 0 ? 0.03 : -0.03), pos[1] - 0.01, pos[2] + 0.06);
            character.add(pupil);
        });

        // 4. 嘴巴（一个微笑的半圆环）
        const mouthMat = new THREE.MeshStandardMaterial({ color: 0xff6688, emissive: 0x441122, emissiveIntensity: 0.3 });
        const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.02, 8, 16, Math.PI), mouthMat);
        mouth.position.set(0, 0.73, 0.28);
        mouth.rotation.x = 0.2;
        mouth.rotation.z = 0.1;
        character.add(mouth);

        // 5. 手臂（两个圆柱）
        const armMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, roughness: 0.4 });
        const armPositions = [[-0.35, 0.45, 0], [0.35, 0.45, 0]];
        armPositions.forEach(pos => {
            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.35, 8), armMat);
            arm.position.set(pos[0], pos[1], pos[2]);
            arm.rotation.z = pos[0] > 0 ? -0.3 : 0.3;
            arm.castShadow = true;
            character.add(arm);
        });

        // 6. 天线（头顶小圆球+细杆，科幻感）
        const antennaMat = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0xff4400, emissiveIntensity: 0.5 });
        const antennaBase = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.015, 0.2, 6), antennaMat);
        antennaBase.position.set(0, 1.05, 0);
        character.add(antennaBase);
        
        const antennaTop = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), antennaMat);
        antennaTop.position.set(0, 1.18, 0);
        character.add(antennaTop);

        // 7. 小披风/围巾（装饰）
        const capeMat = new THREE.MeshStandardMaterial({ 
            color: 0xff6644, 
            roughness: 0.8,
            emissive: 0x441100,
            emissiveIntensity: 0.2
        });
        const cape = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), capeMat);
        cape.position.set(0, 0.2, -0.2);
        character.add(cape);

        // 整体缩放和位置
        character.scale.set(0.7, 0.7, 0.7);
        character.position.set(0, 0, 0);
        scene.add(character);

        // --- 绕角色旋转的光环（点缀效果）---
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x4488ff,
            emissive: 0x4488ff,
            emissiveIntensity: 0.3,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.02, 16, 32), ringMat);
        ring.position.set(0, 0.5, 0);
        ring.rotation.x = Math.PI / 3;
        scene.add(ring);

        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.015, 16, 32), ringMat);
        ring2.position.set(0, 0.5, 0);
        ring2.rotation.x = -Math.PI / 4;
        ring2.rotation.z = 0.5;
        scene.add(ring2);

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.4, 0);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.5;
        controls.update();

        // --- 加载完成 ---
        document.getElementById('loading').textContent = '✅ 墨小科已上线！';
        document.getElementById('loading').style.backgroundColor = 'rgba(0,150,0,0.7)';
        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        }, 1500);

        // --- 窗口自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            
            // 让光环旋转
            ring.rotation.y += 0.01;
            ring2.rotation.y -= 0.015;
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        console.log('🚀 墨小科AR已启动！（代码生成模型）');
    </script>
</body>
</html>
