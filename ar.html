<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨小科AR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        #info {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            font-family: Arial;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-family: Arial;
            z-index: 200;
            background: rgba(0,0,0,0.6);
            padding: 20px 40px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="loading">⏳ 加载模型中...</div>
    <div id="info">📱 墨小科 AR 体验</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- 场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // --- 相机 ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.5, 2.5);

        // --- 渲染器 ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x4488ff, 0.5);
        backLight.position.set(-3, 1, -3);
        scene.add(backLight);

        // --- 地面 ---
        const gridHelper = new THREE.GridHelper(3, 10, 0x4488ff, 0x225588);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.3, 0);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2;
        controls.update();

        // --- 加载模型 ---
        const loader = new GLTFLoader();
        const loadingDiv = document.getElementById('loading');
        
        // 模型链接
        const modelUrl = 'https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf';
        console.log('开始加载模型:', modelUrl);

        loader.load(
            modelUrl,
            (gltf) => {
                const model = gltf.scene;
                model.scale.set(0.5, 0.5, 0.5);
                model.position.set(0, -0.2, 0);
                model.rotation.y = 0.3;
                scene.add(model);
                loadingDiv.textContent = '✅ 墨小科加载成功！';
                loadingDiv.style.backgroundColor = 'rgba(0,200,0,0.7)';
                setTimeout(() => {
                    loadingDiv.style.opacity = '0';
                    setTimeout(() => { loadingDiv.style.display = 'none'; }, 1000);
                }, 1500);
                console.log('✅ 模型加载成功！');
            },
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                loadingDiv.textContent = `⏳ 加载中... ${percent}%`;
            },
            (error) => {
                console.error('❌ 模型加载失败:', error);
                loadingDiv.textContent = '⚠️ 模型加载失败，显示替代球体';
                loadingDiv.style.backgroundColor = 'rgba(200,0,0,0.7)';
                // 显示替代球体
                const geo = new THREE.SphereGeometry(0.4, 32, 32);
                const mat = new THREE.MeshStandardMaterial({ color: 0x00aaff, emissive: 0x004488, emissiveIntensity: 0.3 });
                const sphere = new THREE.Mesh(geo, mat);
                sphere.position.set(0, 0.2, 0);
                scene.add(sphere);
                // 加个光环
                const ringGeo = new THREE.TorusGeometry(0.5, 0.03, 16, 32);
                const ringMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, emissive: 0x004488 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.set(0, 0.2, 0);
                ring.rotation.x = Math.PI / 2;
                scene.add(ring);
            }
        );

        // --- 窗口自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        console.log('🚀 墨小科AR已启动！');
    </script>
</body>
</html>
